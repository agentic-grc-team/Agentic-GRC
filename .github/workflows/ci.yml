name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Temporary PostgreSQL database, created for each run and deleted afterwards.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic_grc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: agentic_grc
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create Supabase auth stub
        run: psql -h 127.0.0.1 -U postgres -d agentic_grc -f tests/sql/supabase_auth_stub.sql

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check models match migrations
        run: alembic check

      # The invitation flow test calls the real Supabase Admin API, which CI cannot reach.
      - name: Run tests
        run: >-
          python -m pytest -v
          --deselect tests/test_organization_hu.py::OrganizationInvitationFlowTests::test_invitation_email_creates_verified_user_and_membership

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
