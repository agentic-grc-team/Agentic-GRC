name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Temporary PostgreSQL database, created for each run and deleted afterwards.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic_grc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: agentic_grc
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Lint gate (AGRC-64): rules and exceptions are in backend/ruff.toml.
      - name: Lint (Ruff)
        run: ruff check . --output-format github

      - name: Create Supabase auth stub
        run: psql -h 127.0.0.1 -U postgres -d agentic_grc -f tests/sql/supabase_auth_stub.sql

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check models match migrations
        run: alembic check

      # Every test runs, including the concurrency test that commits data (this database is
      # thrown away after the run). Coverage of app/ must stay at or above fail_under in .coveragerc.
      - name: Run tests with coverage
        env:
          AGRC_COMMITTING_DB_TESTS: "1"
        run: >-
          python -m pytest -v
          --cov=app --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  backend-image:
    name: Backend container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t agentic-grc-api:ci backend

      # The health endpoint needs no database, so the image can be checked on its own.
      - name: Start container and check health
        run: |
          docker run -d --name api -p 8000:8000 agentic-grc-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs api
          exit 1
