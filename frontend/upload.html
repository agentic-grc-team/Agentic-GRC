<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Evidence | Agentic GRC</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: sans-serif; background-color: #f9fafb; padding: 40px; }
        .upload-container {
            max-width: 600px; margin: 0 auto; background: white;
            padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .drop-zone {
            border: 2px dashed #cbd5e1; border-radius: 8px; padding: 40px;
            margin: 20px 0; background: #f8fafc; cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
        }
        .drop-zone.dragover { background: #e2e8f0; border-color: #3b82f6; }
        .status { margin-top: 15px; font-weight: bold; }
        .success { color: #16a34a; }
        .error { color: #dc2626; }
        .preview-box {
            margin-top: 20px; text-align: left; background: #1e293b; color: #f8fafc;
            padding: 15px; border-radius: 8px; font-size: 0.85em;
            white-space: pre-wrap; display: none; max-height: 200px; overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="upload-container">
        <h2>Upload Compliance Evidence</h2>
        <p style="color: #64748b;">Supported files: PDF, DOCX, TXT, CSV, XLSX (Max 10MB)</p>
        
        <div id="dropZone" class="drop-zone">
            <p>Drag & drop your file here, or click to browse</p>
            <input type="file" id="fileInput" accept=".pdf,.txt,.docx,.csv,.xlsx" style="display: none;">
        </div>

        <div id="statusMessage" class="status"></div>
        <div id="extractedContent" class="preview-box"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const statusMessage = document.getElementById('statusMessage');
        const extractedContent = document.getElementById('extractedContent');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFileUpload(fileInput.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileUpload(e.target.files[0]);
            }
        });

        async function handleFileUpload(file) {
            statusMessage.innerText = `Uploading ${file.name}...`;
            statusMessage.className = "status";
            extractedContent.style.display = "none";

            const formData = new FormData();
            formData.append("file", file);
            formData.append("organization_id", "123e4567-e89b-12d3-a456-426614174000"); 

            try {
                const response = await fetch("http://127.0.0.1:8000/api/v1/evidence/", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer temporary_token"
                    },
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    statusMessage.innerText = `Success: ${result.info}`;
                    statusMessage.className = "status success";
                    
                    if (result.extracted_content_preview) {
                        extractedContent.innerText = "Extracted Text Preview:\n\n" + result.extracted_content_preview;
                        extractedContent.style.display = "block";
                    }
                } else {
                    statusMessage.innerText = `Error: ${result.detail || "Upload failed"}`;
                    statusMessage.className = "status error";
                }
            } catch (error) {
                statusMessage.innerText = "Connection error. Is the FastAPI backend running?";
                statusMessage.className = "status error";
            }
        }
    </script>
</body>
</html>
