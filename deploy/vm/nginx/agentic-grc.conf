# /etc/nginx/sites-available/agentic-grc on the app VM (agentic-grc).
# Serves the built frontend and proxies /api/ to the FastAPI backend on 127.0.0.1:8000.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/agentic-grc/frontend/dist;
    index index.html;

    # Evidence files are limited to 10 MB by the API (EVIDENCE_MAX_BYTES).
    client_max_body_size 12m;

    # Same-origin proxy for Supabase Auth. The university reverse proxy sends a CSP with
    # connect-src 'self', so the browser cannot call *.supabase.co directly. Build the frontend with
    # VITE_SUPABASE_URL=https://gita.udea.edu.co/agentic-grc/supabase. Replace <SUPABASE_PROJECT_REF>.
    location /supabase/ {
        proxy_pass https://<SUPABASE_PROJECT_REF>.supabase.co/;
        proxy_set_header Host <SUPABASE_PROJECT_REF>.supabase.co;
        proxy_ssl_server_name on;
        proxy_ssl_name <SUPABASE_PROJECT_REF>.supabase.co;
        # This route carries sign-in credentials: verify Supabase's certificate (nginx defaults to off).
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An interview turn takes ~40 s on the Tesla M10 (two model calls), over 60 s on a timeout.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
