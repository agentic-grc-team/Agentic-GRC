# /etc/nginx/sites-available/agentic-grc on the app VM (agentic-grc).
# Serves the built frontend and proxies /api/ to the FastAPI backend on 127.0.0.1:8000.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/agentic-grc/frontend/dist;
    index index.html;

    # Evidence files are limited to 10 MB by the API (EVIDENCE_MAX_BYTES).
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Interview turns take up to ~40 s on the Tesla M10.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
