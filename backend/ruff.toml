# Ruff lint gate for the backend (AGRC-64). CI fails on any finding.
# Start with Ruff's default rule set: syntax errors, undefined names, unused imports and variables.
target-version = "py313"
extend-exclude = ["migrations/versions", "uploaded_evidence"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Test modules import shared pytest fixtures (for example `db`) from other test modules;
# pytest uses them by name, which Ruff reports as unused (F401) or redefined (F811).
"tests/**" = ["F401", "F811"]
